name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests, Lean proofs, and differential harness in the dev container
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            bash scripts/test.sh
            bash scripts/build-model.sh
            bash scripts/diff-test.sh
